name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # gh release create needs this

jobs:
  windows:
    # Pinned image — windows-latest auto-promotes when GH bumps the
    # default (typically every ~2 years). Pinning means dependency
    # additions / tool removals from the underlying image don't
    # surprise the build mid-flight. Bump explicitly when ready.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91

      - name: Install task (go-task)
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install NSIS
        # windows-latest dropped NSIS from its pre-installed image
        # circa 2022. Chocolatey is pre-installed, so one line restores
        # makensis on $PATH for `task windows:create:nsis:installer`.
        run: choco install nsis -y --no-progress

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Inject version into build/config.yml + info.json
        shell: bash
        run: |
          ver='${{ steps.ver.outputs.ver }}'
          # In-place value replacement only — never touch surrounding
          # punctuation. The earlier `.*,/` style appended an illegal
          # trailing comma to "file_version" (the last field of its
          # object) and broke JSON parsing in `wails3 generate syso`.
          sed -i "s/^  version: \"[^\"]*\"/  version: \"$ver\"/" build/config.yml
          sed -i "s/\"file_version\": \"[^\"]*\"/\"file_version\": \"$ver\"/" build/windows/info.json
          sed -i "s/\"ProductVersion\": \"[^\"]*\"/\"ProductVersion\": \"$ver\"/" build/windows/info.json
          echo "--- build/config.yml ---"
          grep '^  version:' build/config.yml
          echo "--- build/windows/info.json ---"
          cat build/windows/info.json

      - name: Build Windows .exe + NSIS installer
        run: task windows:package
        env:
          # Plumbed into ldflags as `-X main.version=$VERSION` so the
          # runtime log filename can carry the tag.
          VERSION: ${{ steps.ver.outputs.tag }}

      - name: Locate artifacts
        id: art
        shell: bash
        run: |
          set -e
          exe=$(ls bin/*.exe 2>/dev/null | grep -v -- '-installer' | head -1)
          inst=$(ls bin/*-installer.exe 2>/dev/null | head -1)
          if [ -z "$inst" ]; then
            inst=$(ls build/windows/nsis/*-installer.exe 2>/dev/null | head -1)
          fi
          echo "exe=$exe"   >> "$GITHUB_OUTPUT"
          echo "inst=$inst" >> "$GITHUB_OUTPUT"
          echo "Found: $exe + $inst"

      - name: Create GitHub Release
        # No --prerelease, no --latest. The alpha.26 attempt taught us
        # (via HTTP 422 "Latest release cannot be draft or prerelease")
        # that the GitHub release API treats those two flags as
        # mutually exclusive. README links rely on the
        # /releases/latest/download/<asset> redirect (see #63), so
        # "Latest" wins. The alpha-quality signal lives in the tag
        # name (`v0.1.0-alpha.N`) and the auto-generated notes — losing
        # the prerelease badge is a cosmetic-only cost for an
        # audience that already knows this is a third-party launcher.
        # --latest is omitted because it's the default behavior when
        # there are no other non-prerelease releases to compete with.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create '${{ steps.ver.outputs.tag }}' \
            --title '${{ steps.ver.outputs.tag }}' \
            --generate-notes \
            '${{ steps.art.outputs.exe }}' \
            '${{ steps.art.outputs.inst }}'
