name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: Verify CSS emitted
        run: |
          css_count=$(find dist/assets -name '*.css' | wc -l | tr -d ' ')
          if [ "$css_count" -eq 0 ]; then
            echo "::error::No CSS in dist/assets. Tailwind probably missing from main.tsx import chain."
            exit 1
          fi
          if ! grep -q -- '--background' dist/assets/*.css; then
            echo "::error::CSS missing shadcn --background var; theme variables may be empty."
            exit 1
          fi
          echo "✓ CSS emitted ($css_count file) with shadcn theme variables"

      - name: Upload dist for go:embed
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  go-lint:
    name: Go lint
    # No dependency on `frontend`: this job lints only `./internal/...`,
    # which doesn't import the embedded frontend assets, so it can run
    # in parallel with the frontend job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(find . -name '*.go' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # `go vet` and `golangci-lint` are intentionally scoped to
      # `./internal/...` so we don't compile `main.go`. main.go imports
      # Wails, and Wails on Linux needs `libgtk-3-dev` + `libwebkit2gtk`
      # via cgo — installing those via apt is slow and flaky on GHA
      # runners (37s–37min observed). `main.go` itself is validated by
      # the Windows cross-compile step in the go-test job below.

      - name: go vet
        run: go vet ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
          args: ./internal/...

  go-test:
    name: Go test
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go mod tidy produced changes. Run 'go mod tidy' locally."
            exit 1
          fi

      - name: go test
        # Scoped to ./internal/... so we don't recompile main.go (which
        # imports Wails and needs GTK on Linux). Every existing test
        # lives under internal/beanfun anyway. main.go is validated by
        # the Windows cross-compile step below.
        run: go test -race ./internal/...

      - name: Windows cross-compile (smoke test)
        # Pure-Go cross-compile to the actual deploy target. Wails on
        # Windows uses Win32 + WebView2 with no cgo, so CGO_ENABLED=0
        # is enough — no apt packages needed.
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/launcher.exe ./
